<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Saari</title>
<style>
  /* ponytail: blueberry palette — a few custom props, no framework */
  :root {
    --berry: #5b4b8a;      /* blueberry */
    --berry-deep: #3f3266;
    --berry-soft: #ece8f7;
    --sky: #f6f5fb;
    --forest: #bcd9b3;     /* forest-green haze */
    --ink: #2c2740;
    font-family: system-ui, sans-serif;
  }
  body { margin: 0; padding: 1.25rem; max-width: 720px; margin-inline: auto; color: var(--ink);
         min-height: 100vh; box-sizing: border-box;
         background: radial-gradient(120% 55% at 50% 0%, var(--sky), transparent 60%),
                     linear-gradient(180deg, #fff 30%, var(--forest)); }
  h1 { font-size: 1.5rem; text-align: center; color: var(--berry-deep); letter-spacing: -.02em; }
  .bar { display: flex; align-items: center; justify-content: space-between; margin: 1.25rem 0;
         background: #fff; border-radius: 999px; padding: .35rem; box-shadow: 0 2px 10px rgba(91,75,138,.12); }
  .bar strong { text-transform: capitalize; color: var(--berry-deep); }
  .bar button { font-size: 1.1rem; line-height: 1; padding: .35rem .75rem; cursor: pointer;
                border: none; border-radius: 999px; background: var(--berry-soft); color: var(--berry-deep);
                transition: background .15s, transform .05s; }
  .bar button:hover { background: #ddd5f2; }
  .bar button:active { transform: scale(.94); }
  #months { display: flex; gap: 1.25rem; align-items: flex-start; }
  .month { flex: 1; min-width: 0; }
  .mtitle { text-align: center; text-transform: capitalize; font-weight: 600;
            color: var(--berry-deep); margin-bottom: .5rem; }
  @media (max-width: 560px) { #months { flex-direction: column; } body { max-width: 380px; } }
  /* minmax(0,1fr), not 1fr: a long .who badge would otherwise widen its column past the card. */
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .grid + .grid { margin-top: 6px; }
  .dow { text-align: center; font-size: .7rem; font-weight: 600; text-transform: uppercase;
         letter-spacing: .05em; color: var(--berry); padding: .25rem 0; }
  .day { aspect-ratio: 1; border: 1px solid #e7e3f2; border-radius: 12px; display: flex;
         flex-direction: column; align-items: center; justify-content: flex-start; background: #fff;
         padding: 3px; font-size: .85rem; cursor: pointer; user-select: none;
         touch-action: manipulation; -webkit-tap-highlight-color: transparent;
         transition: transform .06s, box-shadow .15s, background .15s; }
  .day:not(.empty):not(.booked):hover { box-shadow: 0 3px 12px rgba(91,75,138,.18); transform: translateY(-1px); }
  .day.empty { border: none; background: none; cursor: default; }
  .day.weekend { background: #f0eef7; }
  .day.today { border: 2px solid var(--berry); font-weight: 700; }
  .day.sel { outline: 2px solid var(--berry); background: var(--berry-soft); font-weight: 600; }
  .day.holiday { color: #c0392b; font-weight: 600; }
  .day.holiday::after { content: ""; width: 5px; height: 5px; border-radius: 50%;
                        background: #c0392b; margin-top: 2px; }
  .day.closed { cursor: not-allowed; background: #eceaf0; color: #b3aec2; opacity: .7; }
  .day.booked { cursor: not-allowed; background: repeating-linear-gradient(
                45deg, #f4f2fa, #f4f2fa 6px, #eeeaf7 6px, #eeeaf7 12px); color: #9a93b3; }
  .who { font-size: .58rem; color: #fff; border-radius: 6px; padding: 1px 4px; margin-top: 2px;
         max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
         box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  form { display: flex; gap: .5rem; margin-top: 1.25rem; flex-wrap: wrap; }
  input[name=name] { flex: 1; min-width: 8rem; padding: .55rem .75rem; font-size: 1rem;
                     border: 1px solid #d9d3ee; border-radius: 10px; }
  input[name=name]:focus { outline: 2px solid var(--berry); border-color: transparent; }
  form button { padding: .55rem 1.1rem; font-size: 1rem; cursor: pointer; border: none;
                border-radius: 10px; background: var(--berry); color: #fff; font-weight: 600;
                transition: background .15s, transform .05s; }
  form button:hover { background: var(--berry-deep); }
  form button:active { transform: scale(.97); }
  #msg { margin-top: .6rem; min-height: 1.2em; font-size: .9rem; color: var(--berry-deep); }
  #upcoming, #past { margin-top: 1.25rem; font-size: .9rem; list-style: none; padding: 0; }
  #upcoming li, #past li { display: flex; justify-content: space-between; align-items: center;
             padding: .35rem .6rem; border-radius: 8px; }
  #upcoming li:nth-child(odd), #past li:nth-child(odd) { background: rgba(91,75,138,.05); }
  #upcoming button, #past button { border: none; background: none; color: #b04a6a; cursor: pointer;
             font-size: .85rem; margin-left: 1.5rem; flex: none; }
  #upcoming button:hover, #past button:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>🏡 Mökkikalenteri 🫐</h1>
<div class="bar">
  <button id="prev">←</button>
  <strong id="label"></strong>
  <button id="next">→</button>
</div>
<div id="months"></div>

<form id="form">
  <input name="name" placeholder="Nimesi" required autocomplete="off" />
  <button type="submit">Varaa valitut päivät</button>
</form>
<div id="msg"></div>
<h2>Tulevat varaukset</h2>
<ul id="upcoming"></ul>
<h2>Menneet varaukset</h2>
<ul id="past"></ul>

<script src="holidays.js"></script>
<script>
// Local date parts, NOT toISOString() — that formats in UTC and shifts the day
// by one for any positive-offset zone (e.g. Finland UTC+2/+3).
const iso = (d) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const now = new Date();
const todayIso = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
const color = (name) => { // stable per-name hue
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 55% 45%)`;
};

let view = new Date(); view.setDate(1);
let reservations = [];
let sel = new Set();   // ISO date strings currently selected
let anchor = null;     // start day once picked; null = next click starts a fresh range

const bookedBy = (isoDate) =>
  reservations.find((r) => isoDate >= r.start && isoDate <= r.end);

const hint = (t) => { document.getElementById("msg").textContent = t; };

// Pure two-click range: tap start, tap end. No cursor tracking, so nothing gets "stuck".
function pickDay(dateIso) {
  if (anchor === null) {                 // first click: set the start
    anchor = dateIso;
    sel = new Set([dateIso]);
    hint("Valitse lopetuspäivä (tai klikkaa kalenterin ulkopuolelle peruuttaaksesi).");
  } else if (dateIso === anchor) {       // click the start again: cancel
    anchor = null; sel = new Set(); hint("");
  } else {                               // second click: close the range
    const [lo, hi] = [anchor, dateIso].sort();
    sel = new Set();
    for (let d = new Date(lo); iso(d) <= hi; d.setDate(d.getDate() + 1)) sel.add(iso(d));
    anchor = null; hint("");
  }
  render();
}

async function fetchReservations() {
  reservations = await (await fetch("/reservations")).json();
  render();
}

const holCache = {};
const holidaysFor = (y) => holCache[y] ||          // {isoDate: name}, keyed with our own iso()
  (holCache[y] = Object.fromEntries(fiHolidays(y).map(([d, name]) => [iso(d), name])));

// Build one month panel (title + weekday row + day grid) so render() can show two at once.
function monthCard(y, m) {
  const hols = holidaysFor(y);
  const card = document.createElement("div");
  card.className = "month";

  const title = document.createElement("div");
  title.className = "mtitle";
  title.textContent = new Date(y, m, 1).toLocaleString("fi-FI", { month: "long", year: "numeric" });
  card.appendChild(title);

  const dow = document.createElement("div");
  dow.className = "grid";
  dow.innerHTML = ["Ma", "Ti", "Ke", "To", "Pe", "La", "Su"]
    .map((d) => `<div class="dow">${d}</div>`).join("");
  card.appendChild(dow);

  const days = document.createElement("div");
  days.className = "grid";
  const closed = m + 1 >= 11 || m + 1 <= 3; // whole month closed Nov–Mar (mirror of server)
  const lead = (new Date(y, m, 1).getDay() + 6) % 7; // Monday-first
  for (let i = 0; i < lead; i++) {
    const e = document.createElement("div"); e.className = "day empty"; days.appendChild(e);
  }
  const last = new Date(y, m + 1, 0).getDate();
  for (let d = 1; d <= last; d++) {
    const dateIso = iso(new Date(y, m, d));
    const cell = document.createElement("div");
    cell.className = "day";
    const wd = new Date(y, m, d).getDay();
    if (wd === 0 || wd === 6) cell.classList.add("weekend");
    if (dateIso === todayIso) cell.classList.add("today");
    cell.textContent = d;
    const hol = hols[dateIso];
    if (hol) { cell.classList.add("holiday"); cell.title = hol; }
    const b = bookedBy(dateIso);
    if (closed) {
      cell.classList.add("closed");
      cell.title = "Suljettu (marras–maaliskuu)";
    } else if (b) {
      cell.classList.add("booked");
      const w = document.createElement("span");
      w.className = "who"; w.textContent = b.name; w.style.background = color(b.name);
      cell.appendChild(w);
    } else {
      if (sel.has(dateIso)) cell.classList.add("sel");
      cell.onclick = () => pickDay(dateIso);
    }
    days.appendChild(cell);
  }
  card.appendChild(days);
  return card;
}

function render() {
  const y = view.getFullYear(), m = view.getMonth();
  const next = new Date(y, m + 1, 1); // month after `view` — may roll into next year
  document.getElementById("label").textContent =
    view.toLocaleString("fi-FI", { month: "long" }) + " – " +
    next.toLocaleString("fi-FI", { month: "long", year: "numeric" });

  const wrap = document.getElementById("months");
  wrap.innerHTML = "";
  wrap.append(monthCard(y, m), monthCard(next.getFullYear(), next.getMonth()));
  renderList();
}

function renderList() {
  const up = document.getElementById("upcoming"), past = document.getElementById("past");
  up.innerHTML = past.innerHTML = "";
  // upcoming = not yet ended, soonest first; past = already ended, most recent first
  [...reservations].sort((a, b) => a.start.localeCompare(b.start)).forEach((r) => {
    const li = document.createElement("li");
    const span = document.createElement("span");
    span.textContent = `${r.name}: ${r.start} → ${r.end}`;
    span.style.color = color(r.name);
    const del = document.createElement("button");
    const isPast = r.end < todayIso;
    del.textContent = isPast ? "poista" : "peruuta"; del.title = isPast ? "Poista tämä varaus" : "Peruuta tämä varaus";
    del.onclick = async () => {
      await fetch("/reservations/" + encodeURIComponent(r.id), { method: "DELETE" });
      fetchReservations();
    };
    li.append(span, del);
    if (isPast) past.prepend(li); else up.appendChild(li);
  });
}

document.getElementById("prev").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
document.getElementById("next").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };

// A click/tap anywhere outside the calendar cancels a half-made pick (mouse and touch alike).
document.addEventListener("pointerdown", (e) => {
  if (anchor && !e.target.closest?.("#months")) { anchor = null; sel = new Set(); hint(""); render(); }
});

document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const name = e.target.name.value.trim();
  if (!sel.size) { msg.textContent = "Klikkaa aloituspäivä, sitten lopetuspäivä."; return; }
  const dates = [...sel].sort();
  const start = dates[0], end = dates[dates.length - 1];
  const res = await fetch("/reservations", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, start, end }),
  });
  const data = await res.json();
  if (!res.ok) { msg.textContent = "⚠ " + data.error; return; }
  msg.textContent = `Varattu ${start} → ${end} nimelle ${name}.`;
  sel.clear(); anchor = null;
  fetchReservations();
};

fetchReservations();
</script>
</body>
</html>
